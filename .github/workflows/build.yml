name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          apt-get update
          apt-get install -y unzip

      - name: Extract Godot project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Check project
        run: |
          ls -la project
          test -f project/project.godot

      - name: Import project
        run: |
          godot --headless --editor --quit --path project

      - name: Build APK
        run: |
          mkdir -p project/build
          godot --headless \
            --path project \
            --export-debug "Android" \
            project/build/AI_Cozy_Home.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Cozy-Home-APK
          path: project/build/AI_Cozy_Home.apk
