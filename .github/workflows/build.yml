name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.1

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AI-Cozy-Home.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Cozy-Home-APK
          path: build/AI-Cozy-Home.apk
